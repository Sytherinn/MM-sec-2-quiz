<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmentation, Marketing Mix and Product Decisions Quiz</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #d5dbe5;
    --accent: #1b4f72;
    --accent-ink: #ffffff;
    --good: #1e7a4c;
    --good-bg: #e3f4ea;
    --bad: #a63a2b;
    --bad-bg: #fbe8e4;
    --focus: #e0a100;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1623;
      --surface: #182235;
      --ink: #e8edf5;
      --muted: #9aa6ba;
      --line: #2c3a52;
      --accent: #6fb1e0;
      --accent-ink: #0f1623;
      --good: #6fd09a;
      --good-bg: #17382a;
      --bad: #f0907f;
      --bad-bg: #3d2020;
      --focus: #f2c14e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    line-height: 1.2;
    margin: 0 0 6px;
  }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
  }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
  .q {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(1.15rem, 3vw, 1.4rem);
    line-height: 1.4;
    margin: 0 0 18px;
  }
  .opts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; text-align: left;
    background: var(--surface); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 8px;
    padding: 12px 14px; font: inherit; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .tag {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--line); display: grid; place-items: center;
    font-size: .85rem; font-weight: 600; color: var(--muted);
  }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .tag { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .tag { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .feedback {
    margin-top: 16px; padding: 12px 14px; border-radius: 8px;
    border-left: 4px solid var(--line); background: var(--bg);
  }
  .feedback.good { border-left-color: var(--good); }
  .feedback.bad { border-left-color: var(--bad); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .hintrow { margin-top: 14px; font-size: .95rem; color: var(--muted); min-height: 1.5em; }
  .link {
    background: none; border: none; padding: 0; font: inherit; color: var(--accent);
    text-decoration: underline; cursor: pointer;
  }
  .actions { display: flex; justify-content: flex-end; margin-top: 20px; gap: 10px; }
  .btn {
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 8px; padding: 11px 22px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .score { font-family: Georgia, serif; font-size: 3rem; line-height: 1; margin: 6px 0; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .review li { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .review li.ok { border-left: 4px solid var(--good); }
  .review li.no { border-left: 4px solid var(--bad); }
  .review .rq { font-weight: 600; margin: 0 0 4px; }
  .review p { margin: 2px 0; font-size: .95rem; }
  .muted { color: var(--muted); }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Segmentation, Marketing Mix and Product Decisions</h1>
  <p class="sub">Market segmentation, the marketing mix, new products, the product life cycle, positioning, branding and packaging. 12 questions.</p>

  <section id="quiz" class="card" aria-live="polite"></section>
  <section id="result" class="card hidden"></section>
</main>

<script>
(function () {
  var QUESTIONS = [
    { q: "A company divides its market into groups based on age, gender, income and occupation. Which basis of segmentation is this?",
      o: ["Geographic", "Demographic", "Psychographic", "Behavioural"], a: 1,
      hint: "These variables describe who the customers are as people.",
      e: "Demographic segmentation uses variables such as age, gender, income, occupation, education and family size. It is the most widely used basis because the data is easy to measure." },
    { q: "Which of the following is a BEHAVIOURAL basis of segmentation?",
      o: ["Occupation", "Lifestyle", "Brand loyalty status", "Climate"], a: 2,
      e: "Behavioural segmentation uses buying behaviour: usage rate, benefits sought, occasions, user status and loyalty. Occupation is demographic, lifestyle is psychographic and climate is geographic." },
    { q: "A firm decides to focus all its effort on one small, specialised segment with a single marketing mix. This is:",
      o: ["Undifferentiated marketing", "Differentiated marketing", "Concentrated (niche) marketing", "Mass marketing"], a: 2,
      hint: "Think of putting all your effort into one niche.",
      e: "Concentrated marketing targets one segment with one tailored mix. Undifferentiated marketing ignores segment differences, and differentiated marketing serves several segments with separate mixes." },
    { q: "A market segment is too small to be profitable for a firm to serve. Which requirement of effective segmentation does it fail?",
      o: ["Measurability", "Accessibility", "Substantiality", "Actionability"], a: 2,
      e: "A segment must be substantial, meaning large and profitable enough to be worth serving. The other requirements are measurable, accessible, differentiable and actionable." },
    { q: "Who classified the elements of the marketing mix into the four Ps (Product, Price, Place, Promotion)?",
      o: ["Philip Kotler", "E. Jerome McCarthy", "Michael Porter", "Peter Drucker"], a: 1,
      e: "E. Jerome McCarthy proposed the four Ps classification. The term “marketing mix” itself was popularised by Neil Borden." },
    { q: "Which of the following is an UNCONTROLLABLE (external) factor affecting the marketing mix?",
      o: ["Product quality", "The company’s advertising budget", "Competitors’ actions", "Choice of distribution channel"], a: 2,
      e: "Competitors’ actions, the economy, laws, technology and culture are external factors outside the firm’s control. Product quality, budgets and channel choices are internal and controllable." },
    { q: "A hotel guest really buys a comfortable night’s rest, not just a room. In the levels of a product, this is the:",
      o: ["Core product", "Actual product", "Augmented product", "Potential product"], a: 0,
      e: "The core product is the basic benefit or need the customer is really buying. The actual product adds features, design, quality, brand and packaging, and the augmented product adds services such as warranty and support." },
    { q: "In the new product development process, which stage comes immediately AFTER idea screening?",
      o: ["Business analysis", "Test marketing", "Concept development and testing", "Commercialisation"], a: 2,
      hint: "The order is: generate, screen, develop the concept, analyse the business case, build, test, launch.",
      e: "The sequence is idea generation, idea screening, concept development and testing, business analysis, product development, test marketing and commercialisation." },
    { q: "In which stage of the product life cycle do sales rise rapidly, profits increase and new competitors enter the market?",
      o: ["Introduction", "Growth", "Maturity", "Decline"], a: 1,
      e: "The growth stage brings fast sales growth and rising profits, which attract competitors. Introduction has slow sales and losses, maturity has peak sales with slowing growth, and decline has falling sales." },
    { q: "Which statement best describes product positioning?",
      o: ["Fixing the price of a product", "Placing the product in as many outlets as possible", "Creating a distinct place for the product in the minds of target customers", "Dividing the market into groups of buyers"], a: 2,
      e: "Positioning is the process of designing a product and image so that it occupies a clear, distinctive and valued place in the target customers’ minds relative to competing products." },
    { q: "A company uses its well-known brand name to launch a product in an entirely new category. This is called:",
      o: ["Line extension", "Brand extension", "Multi-branding", "Private branding"], a: 1,
      e: "Brand extension uses an established brand name for a new product category. A line extension adds new variants (flavours, sizes) within the same category under the same brand." },
    { q: "Which of the following is NOT a function of packaging?",
      o: ["Protecting the product", "Promoting and identifying the brand", "Providing convenience to the user", "Determining the channels of distribution"], a: 3,
      e: "Packaging protects the product, identifies and promotes the brand, provides information and convenience, and can add value. Channel decisions are part of the place element of the mix, not a packaging function." }
  ];
  var LETTERS = ["A", "B", "C", "D"];
  var quiz = document.getElementById("quiz");
  var result = document.getElementById("result");
  var idx = 0, score = 0, answered = false, answers = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function render() {
    var item = QUESTIONS[idx];
    answered = false;
    quiz.innerHTML = "";

    var bar = el("div", "bar"), fill = el("span");
    fill.style.width = (idx / QUESTIONS.length * 100) + "%";
    bar.appendChild(fill);
    var meta = el("div", "meta");
    meta.appendChild(el("span", "", "Question " + (idx + 1) + " of " + QUESTIONS.length));
    meta.appendChild(el("span", "", "Score: " + score));
    quiz.appendChild(bar);
    quiz.appendChild(meta);

    quiz.appendChild(el("p", "q", item.q));

    var list = el("ul", "opts");
    item.o.forEach(function (text, i) {
      var li = el("li");
      var b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("span", "tag", LETTERS[i]));
      b.appendChild(el("span", "", text));
      b.addEventListener("click", function () { choose(i); });
      li.appendChild(b);
      list.appendChild(li);
    });
    quiz.appendChild(list);

    var hintrow = el("div", "hintrow");
    if (item.hint) {
      var hb = el("button", "link", "Show hint");
      hb.type = "button";
      hb.addEventListener("click", function () {
        hintrow.textContent = "Hint: " + item.hint;
      });
      hintrow.appendChild(hb);
    }
    quiz.appendChild(hintrow);

    var fb = el("div", "feedback hidden");
    fb.id = "fb";
    quiz.appendChild(fb);

    var actions = el("div", "actions");
    var next = el("button", "btn", idx === QUESTIONS.length - 1 ? "See results" : "Next question");
    next.type = "button";
    next.id = "next";
    next.disabled = true;
    next.addEventListener("click", advance);
    actions.appendChild(next);
    quiz.appendChild(actions);
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    var item = QUESTIONS[idx];
    var ok = i === item.a;
    if (ok) score++;
    answers.push(i);

    var buttons = quiz.querySelectorAll(".opt");
    buttons.forEach(function (b, k) {
      b.disabled = true;
      if (k === item.a) b.classList.add("correct");
      else if (k === i) b.classList.add("wrong");
    });

    var fb = document.getElementById("fb");
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.innerHTML = "";
    fb.appendChild(el("strong", "", ok ? "Correct." : "Not quite. The answer is " + LETTERS[item.a] + "."));
    fb.appendChild(el("span", "", item.e));

    var next = document.getElementById("next");
    next.disabled = false;
    next.focus();
  }

  function advance() {
    if (!answered) return;
    idx++;
    if (idx < QUESTIONS.length) render();
    else showResult();
  }

  function verdict(pct) {
    if (pct >= 90) return "Excellent. You are exam ready.";
    if (pct >= 70) return "Good. Revise the topics you missed.";
    if (pct >= 50) return "Average. Re-read the notes on segmentation, the product life cycle and new product development.";
    return "Needs revision. Go through the study notes again and retake the quiz.";
  }

  function showResult() {
    quiz.classList.add("hidden");
    result.classList.remove("hidden");
    result.innerHTML = "";
    var total = QUESTIONS.length;
    result.appendChild(el("h1", "", "Your result"));
    result.appendChild(el("div", "score", score + " / " + total));
    result.appendChild(el("p", "", verdict(score / total * 100)));

    var actions = el("div", "actions");
    actions.style.justifyContent = "flex-start";
    var again = el("button", "btn", "Retake quiz");
    again.type = "button";
    again.addEventListener("click", restart);
    actions.appendChild(again);
    result.appendChild(actions);

    var ul = el("ul", "review");
    QUESTIONS.forEach(function (item, k) {
      var ok = answers[k] === item.a;
      var li = el("li", ok ? "ok" : "no");
      li.appendChild(el("p", "rq", (k + 1) + ". " + item.q));
      li.appendChild(el("p", "", "Your answer: " + item.o[answers[k]] + (ok ? " (correct)" : "")));
      if (!ok) li.appendChild(el("p", "", "Correct answer: " + item.o[item.a]));
      li.appendChild(el("p", "muted", item.e));
      ul.appendChild(li);
    });
    result.appendChild(ul);
    window.scrollTo(0, 0);
  }

  function restart() {
    idx = 0; score = 0; answers = [];
    result.classList.add("hidden");
    quiz.classList.remove("hidden");
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (e) {
    if (quiz.classList.contains("hidden")) return;
    var k = e.key.toLowerCase();
    var n = "abcd".indexOf(k);
    if (n < 0 && k >= "1" && k <= "4") n = Number(k) - 1;
    if (n >= 0 && !answered && n < QUESTIONS[idx].o.length) { choose(n); return; }
    if (e.key === "Enter" && answered) { e.preventDefault(); advance(); }
  });

  render();
})();
</script>
</body>
</html>
